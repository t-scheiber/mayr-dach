name: Renovate AI Fix
run-name: Renovate ${{ inputs.mode || github.event.client_payload.mode || 'validate' }} for PR ${{ inputs.pr_number || github.event.client_payload.pr_number }}

on:
  repository_dispatch:
    types: [renovate-validate]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Renovate pull request number
        required: true
        type: string

      mode:
        description: Validate and merge, or retry merge only
        default: validate
        type: choice
        options: [validate, merge]

permissions:
  contents: read

concurrency:
  group: renovate-validation-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  renovate-ai-fix:
    if: (inputs.mode || github.event.client_payload.mode || 'validate') != 'merge'
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
      POLICY_REVISION: '2'
      CI: 'true'
      AI_PROVIDER: openrouter
      AI_MODEL: z-ai/glm-5.3-flash
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-not-used-outside-disposable-validation
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout trusted helpers from default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/renovate
          path: .renovate-trusted

      - name: Stage helpers outside the application checkout
        run: |
          cp -R .renovate-trusted/.github/renovate "$RUNNER_TEMP/renovate-helpers"
          echo "RENOVATE_PLAN=$RUNNER_TEMP/renovate-plan.json" >> "$GITHUB_ENV"

      - name: Resolve and mark the exact PR revision
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/renovate-helpers/scripts/pr-lifecycle.mjs" prepare

      - name: Checkout the resolved revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Include current default branch in validation
        id: merge
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          git config user.name 'Renovate AI Fixer'
          git config user.email 'renovate-ai-fixer@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git merge --no-edit "$BASE_SHA"

      - name: Resolve dependency merge conflicts
        if: steps.merge.outcome == 'failure'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          test -n "$(git diff --name-only --diff-filter=U)"
          node "$RUNNER_TEMP/renovate-helpers/scripts/ai-renovate-fix.mjs" --conflicts --attempts 3
          git commit -m 'fix(deps): resolve dependency update conflicts'

      - name: Record the merged validation baseline
        run: echo "VALIDATION_BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Detect validation for all project directories
        id: detect
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: node "$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs" detect

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Set up Bun
        if: steps.detect.outputs.needs_bun == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.detect.outputs.bun_version }}

      - name: Set up pnpm
        if: steps.detect.outputs.needs_pnpm == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.detect.outputs.pnpm_version }}

      - name: Set up Java
        if: steps.detect.outputs.needs_java == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        if: steps.detect.outputs.needs_python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Install Rust desktop build dependencies
        if: steps.detect.outputs.needs_rust == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workflow validator
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install and repair stale lockfiles
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs" install 2>&1 | tee renovate-validation.log
          git add -u
          git diff --cached --quiet || git commit -m 'chore(deps): regenerate dependency lockfiles'

      - name: Validate update
        id: validate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs" validate 2>&1 | tee -a renovate-validation.log

      - name: Repair using GLM 5.3 Flash
        id: repair
        if: steps.install.outcome == 'failure' || steps.validate.outcome == 'failure'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          install_command="node '$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs' install"
          printf '%s\n' "$install_command" > .renovate-install-command
          node "$RUNNER_TEMP/renovate-helpers/scripts/ai-renovate-fix.mjs" \
            --log renovate-validation.log --attempts 3 \
            --command "$install_command" \
            --command "node '$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs' validate"

      - name: Final validation without API credentials
        id: final
        if: steps.validate.outcome == 'success' || steps.repair.outcome == 'success'
        run: |
          node "$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs" install
          node "$RUNNER_TEMP/renovate-helpers/scripts/validation-plan.mjs" validate
          git add -u
          git diff --cached --quiet || git commit -m 'fix(deps): apply validated dependency migration'

      - name: Publish repair and validation evidence
        if: always() && steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          VALIDATION_RESULT: ${{ steps.final.outcome }}
        run: node "$RUNNER_TEMP/renovate-helpers/scripts/pr-lifecycle.mjs" finish

  merge:
    needs: renovate-ai-fix
    if: always() && (needs.renovate-ai-fix.result == 'success' || (needs.renovate-ai-fix.result == 'skipped' && (inputs.mode || github.event.client_payload.mode) == 'merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
      actions: read
    steps:
      - name: Checkout trusted merge controller
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/renovate
      - name: Merge only the validated current revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
        run: node .github/renovate/scripts/merge-pr.mjs
